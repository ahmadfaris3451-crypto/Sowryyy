<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorry that I was the bad guy in your life.</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body id="mainBody">

  <div class="card-container" id="lockScreen">
    <div class="header-text">
      <h1>SORRY 🥺</h1>
      <p>Masukkan PIN 4-Digit - Hint : Birthday (Faris)</p>
    </div>

    <div class="pin-display">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <div class="divider"></div>

    <div class="keypad">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key action-key" onclick="clearPin()">C</button>
      <button class="key" onclick="pressKey('0')">0</button>
      <button class="key action-key" onclick="submitPin()">↵</button>
    </div>

    <p id="errorMsg" class="error"></p>
  </div>

  <div class="card-container hidden" id="page2">
    <div class="gif-box">
      <img src="img/surprise.gif" alt="GIF Animation 1" class="page2-gif">
    </div>

    <div class="page2-text">
      <h2>Awak maafkan sy x ni 🥺</h2>
    </div>

    <div class="btn-group">
      <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()" ontouchstart="moveButton()">X</button>
      <button id="yesBtn" onclick="goToRepeatPage()">yee</button>
    </div>
  </div>

  <div class="card-container hidden" id="pageRepeat">
    <div class="gif-box">
      <img src="img/surprise2.gif" alt="GIF Animation 2" class="page2-gif" onerror="this.onerror=null; this.src='img/surprise.gif';">
    </div>

    <div class="page2-text">
      <h2 id="repeatText">Betul ni awak dh maafkan sy 🥺</h2>
    </div>

    <div class="btn-group" style="justify-content: center;">
      <button id="yeAwakBtn" onclick="handleYeAwakClick()">ye awak</button>
    </div>
  </div>

  <div class="card-container hidden" id="page3">
    <div class="gif-box">
      <img src="img/surprise3.gif" alt="GIF Animation 3" class="page2-gif" onerror="this.onerror=null; this.src='img/surprise.gif';">
    </div>

    <div class="page2-text">
      <h2>ok tq</h2>
    </div>

    <div class="btn-group" style="justify-content: center;">
      <button id="hehBtn" onclick="goToMainContent()">heh</button>
    </div>
  </div>

  <div class="card-container hidden" id="mainContent">
    <div class="birthday-box">
      <h1>MESSAGE</h1>
      
      <div class="section">
        <p id="typedMessage"></p>
      </div>

      <!-- Hantar parameter 'ya' atau 'X' ke fungsi triggerJumpscare1 -->
      <div class="btn-group message-btn-group">
        <button id="yesMessageBtn" class="msg-btn" onclick="triggerJumpscare1('ya')">ya</button>
        <button id="xMessageBtn" class="msg-btn" onclick="triggerJumpscare1('X')">X</button>
      </div>
    </div>
  </div>

  <!-- PAGE LEPAS JUMPSCARE 1 -->
  <div class="card-container hidden" id="postJumpscarePage">
    <div class="page2-text">
      <h2>terkejut ke?? padan muka, ok sorry x buat dh.</h2>
    </div>

    <div class="btn-group" style="justify-content: center; margin-top: 20px; height: auto;">
      <button id="nextBtn2" onclick="triggerJumpscare2()">next</button>
    </div>
  </div>

  <!-- PAGE PENUTUP (LEPAS JUMPSCARE 2) -->
  <div class="card-container hidden" id="finalPage">
    <div class="page2-text">
      <h2>ok sorry xde dh bye, jangan tekan button bawah ni.</h2>
    </div>

    <div class="btn-group" style="justify-content: center; margin-top: 20px; height: auto;">
      <button id="jumpscareBtn" onclick="triggerFakeTextThenJumpscare()">jumpscare</button>
    </div>
  </div>

  <!-- PAGE "XDE PAPE" -->
  <div class="card-container hidden" id="fakeTextPage">
    <div class="page2-text" style="margin-bottom: 0;">
      <h2>xde pape</h2>
    </div>
  </div>

  <!-- CONTAINER JUMPSCARE -->
  <div id="jumpscareContainer" class="jumpscare-overlay hidden">
    <img src="img/cat-jumpscare.jpg" alt="Jumpscare Cat" id="jumpscareImg">
  </div>

  <!-- BLACK SCREEN FINAL -->
  <div id="blackScreen" class="black-screen-overlay hidden"></div>

  <!-- AUDIO BACKGROUND & JUMPSCARE -->
  <audio id="bgMusic" loop>
    <source src="img/bg-music.mp3" type="audio/mpeg">
  </audio>

  <audio id="screamSound" preload="auto">
    <source src="img/scream.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
